<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andorinea</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/svg" sizes="32x32" href="favicon.svg">
    <style type="text/css">
        body {
            background-color: var(--lighter-neutral);
        }

        h1 {
            font-family: 'Grand Hotel', cursive;
            font-size: 3rem;
            text-align: center;
            margin: 0.5rem 0;
        }

        .container {
            display: flex;
            justify-content: center;
            margin: 2rem 2rem;
        }

        .container img {
            margin-top: 2rem;;
        }
    

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .links a {
            width: 200px;
            text-align: center;
        }

        .subtitle {
            display: flex;
            justify-content: center;
            margin: 0 1rem;
            font-family: 'Source Sans 3', sans-serif;
        }

        @media screen and (max-width: 600px) {
            .container img {
                max-height: 50vh;
            }
    
            .links {
                flex-direction: column;
                align-items: center;
                margin-bottom: 2rem;
            }

            .links a {
                width: 100%;
                text-align: center;
            }
    
            .subtitle {
                font-size: 1rem;
            }
            
        }
    </style>
    
</head>

<body>
    <div class="container">
        <img src="img/andorinea-logo-default.svg" alt="Logo andorinea: um circulo vermelho com a cabeça de uma andorinea de perfil, na cor amarela e com detalhes em preto.">
    </div>
     <h1>andorinea</h1>
    <p class="subtitle">Em breve novidades. Enquanto isso confira:</p>
    <div class="container links">
       <a href="https://instagram.com/andorinea" class="btn-nav primary source-sans-3-400 active">instagram</a>
       <a href="https://falandosozinhacomasparedes.substack.com/" class="btn-nav primary source-sans-3-400 active">newsletter</a>
       <a href="https://www.behance.net/izadoranetz" class="btn-nav primary source-sans-3-400 active">behance</a>
       <a href="https://www.linkedin.com/in/izadora-netz/" class="btn-nav primary source-sans-3-400 active">linkedin</a>
    </div>
</body>

</html>
