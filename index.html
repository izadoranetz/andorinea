<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andorinea</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/svg" sizes="32x32" href="favicon.svg">
    <style type="text/css">
        body {
            background-color: #F6CDC7;
        }
    
        .container {
            display: flex;
            justify-content: center;
            margin: 1rem 2rem;
        }
    
        .container img {
            max-height: 70vh;
        }


        .links {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1rem;
        }

        .subtitle {
            display: flex;
            justify-content: center;
            margin: 0 1rem;
            font-family: 'Source Sans 3', sans-serif;
        }

        @media screen and (max-width: 600px) {
            .container img {
                max-height: 50vh;
            }
    
            .links {
                flex-direction: column;
                align-items: center;
            }

            .links a {
                width: 100%;
                text-align: center;
            }
    
            .subtitle {
                font-size: 1rem;
            }
            
        }
    </style>
    
</head>

    <div class="container">
